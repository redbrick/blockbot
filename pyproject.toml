[project]
name = "blockbot"
version = "0.1.0"
description = "Discord bot maintained by the Redbrick webgroup"
readme = "README.md"
requires-python = "~=3.14.0"
license = { text = "MIT" }
authors = [{ name = "JedHazaymeh", email = "magma@redbrick.dcu.ie" }, { name = "nova", email = "nova@redbrick.dcu.ie"}]
maintainers = [{ name = "nova", email = "nova@redbrick.dcu.ie"}, { name = "wizzdom", email = "wizzdom@redbrick.dcu.ie"}]
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "asyncpg>=0.31.0",
    "dnspython>=2.8.0",
    "fortune-python>=1.1.2",
    "hikari>=2.5.0",
    "hikari-arc>=2.2.0",
    "hikari-miru>=4.2.0",
    "pyfiglet>=1.0.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "rcon>=2.4.9",
    "miniopy-async>=1.23.5",
]

[project.urls]
Documentation = "https://docs.redbrick.dcu.ie/webgroup/blockbot/"
Repository = "https://github.com/redbrick/blockbot"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "ruff>=0.15.9",
    "uv>=0.11.3",  # this should be the same as in the github workflows
]
nox = [
    "nox>=2026.2.9",
]

[tool.ruff]
include = ["./src/*.py", "noxfile.py"]
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # Error (pycodestyle)
    "W", # Warning (pycodestyle)
    "I", # isort
    "N", # pep8-naming
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "A", # flake8-builtins
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TC", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "PL", # Pylint
    "PERF", # Perflint
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line-too-long
    "PLR2004", # magic-value-comparison
    "PLR0913", # too-many-arguments
    "COM812", # missing-trailing-comma
    "TC002", # typing-only-third-party-import
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv]
required-version = "~=0.11"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
